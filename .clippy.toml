too-many-lines-threshold = 30
cognitive-complexity-threshold = 5
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-consts = false
allow-unwrap-in-tests = true
disallowed-methods = [
    { path = "std::env::var", reason = "Read configuration in the entry point and pass it to the library" },
    { path = "std::env::var_os", reason = "Read configuration in the entry point and pass it to the library" },
    { path = "std::env::vars", reason = "Read configuration in the entry point and pass it to the library" },
    { path = "std::env::vars_os", reason = "Read configuration in the entry point and pass it to the library" },
    { path = "std::env::set_var", reason = "Pass configuration explicitly instead of modifying the process environment" },
    { path = "std::env::remove_var", reason = "Pass configuration explicitly instead of modifying the process environment" },
    { path = "std::env::args", reason = "Parse command-line arguments in the entry point and pass options to the library" },
    { path = "std::env::args_os", reason = "Parse command-line arguments in the entry point and pass options to the library" },
    { path = "std::env::current_dir", reason = "Resolve paths in the entry point and pass them to the library" },
    { path = "std::env::set_current_dir", reason = "Pass paths explicitly instead of changing the process working directory" },
    { path = "std::env::current_exe", reason = "Resolve the executable path in the entry point and pass it to the library" },
    { path = "std::env::temp_dir", reason = "Choose the temporary directory in the entry point and pass it to the library" },
    { path = "std::thread::spawn", reason = "Start threads in the native entry point because this call panics on wasm32" },
    { path = "std::time::SystemTime::now", reason = "Pass the current time to the library" },
    { path = "std::time::SystemTime::elapsed", reason = "Pass the current time to the library and compute the difference from that value" },
    { path = "std::time::Instant::now", reason = "Read the monotonic clock in the entry point and pass timing information to the library" },
    { path = "std::time::Instant::elapsed", reason = "Pass the current monotonic time to the library and compute the difference from that value" },
]
