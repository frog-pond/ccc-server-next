too-many-lines-threshold = 30
cognitive-complexity-threshold = 5
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-consts = false
allow-unwrap-in-tests = true
disallowed-methods = [
    { path = "std::env::var", reason = "Read configuration in the entry point and pass it to the library" },
    { path = "std::env::var_os", reason = "Read configuration in the entry point and pass it to the library" },
    { path = "std::env::vars", reason = "Read configuration in the entry point and pass it to the library" },
    { path = "std::env::vars_os", reason = "Read configuration in the entry point and pass it to the library" },
    { path = "std::env::args", reason = "Parse command-line arguments in the entry point and pass options to the library" },
    { path = "std::time::SystemTime::now", reason = "Pass the current time to the library" },
    { path = "std::time::Instant::now", reason = "Read the monotonic clock in the entry point and pass timing information to the library" },
]
