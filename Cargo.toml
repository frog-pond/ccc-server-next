[workspace]
resolver = "2"
members = [
	"ccc-native",
	"ccc-schema",
	"e2e",
	"experiments/native",
	"experiments/route",
	"experiments/worker",
	"trifecta-freshness",
]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
indexing_slicing = "deny"
disallowed_methods = "deny"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.100"

[workspace.dependencies]
bytes = "1.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.0", features = ["json", "query"] }
serde_json = "1.0.114"
similar = "3.0.0"
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread"] }
# The experiment probes the traits from the unmerged Trifecta draft branch.
trifecta = { git = "https://github.com/frog-pond/ccc-server-next.git", rev = "99170f075f4f5b3c357626865b5faeccc097bbb5" }
url = "2.5.0"
