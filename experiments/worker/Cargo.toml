[package]
name = "worker-experiment"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
# workers-rs requires Rust 1.91 and the pinned Trifecta draft requires 1.98.
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json.workspace = true
# Draft `trifecta` branch, pinned so the compile probes keep the same bounds.
trifecta = { git = "https://github.com/frog-pond/ccc-server-next.git", rev = "99170f075f4f5b3c357626865b5faeccc097bbb5" }
worker = "=0.9.0"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
reqwest = { version = "=0.13.4", default-features = false }
