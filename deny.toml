[graph]
# The supported builds are the Linux container and the Worker WASM target.
# The wasm-bindgen test harness has a Tokio dependency only for Emscripten.
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
# Entry points use their runtime-specific clients. Keep the shared route in the graph.
exclude = ["e2e", "fixture-experiment-native", "worker-experiment"]

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "axum", reason = "Only native server code uses the web framework" },
    { crate = "reqwest", reason = "Only native code uses this HTTP client" },
    { crate = "tokio", reason = "Only native code uses this runtime" },
    { crate = "worker", reason = "Only Worker-specific code uses workers-rs" },
]
