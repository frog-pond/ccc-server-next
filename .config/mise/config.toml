[env]
_.file = '.env'

[tools]
"npm:wrangler" = "4.166.0"
"cargo:worker-build" = "0.9.0"
"aqua:EmbarkStudios/cargo-deny" = "0.22.0"
"cargo:cargo-public-api" = "0.52.0"
"github:wasm-bindgen/wasm-bindgen" = "0.2.127"

[tasks.build]
run = "cargo build"

[tasks.check]
depends = ["clippy", "fmt-check", "test", "test:doc", "test:tools", "doc", "check:dependencies", "check:api"]

[tasks."check:wasm"]
description = "Build, lint, check documentation and test the shared crates on Wasm"
run = "python3 -B tools/workspace.py"

[tasks.doc]
run = "cargo doc --workspace --all-features --locked --no-deps"
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks."check:dependencies"]
run = "cargo deny --all-features --locked check bans"

[tasks."check:api"]
description = "Check committed public API listings"
run = "python3 -B tools/public-api --check"

[tasks."setup:api"]
description = "Install the pinned Rust toolchain and Wasm target for public API listings"
run = "python3 -B tools/public-api --install-toolchain"

[tasks."update:api"]
description = "Regenerate public API listings"
run = "python3 -B tools/public-api"

[tasks.clippy]
run = "cargo clippy --workspace --all-features --all-targets --locked"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all -- --check"

[tasks.test]
run = "cargo test --workspace --all-features --all-targets --locked --offline --no-fail-fast"

[tasks."test:doc"]
run = "cargo test --workspace --all-features --locked --offline --doc"

[tasks."test:tools"]
description = "Check board rules and workspace structure offline"
run = "python3 -m unittest discover -s tools/tests -p 'test_*.py'"
env = { PYTHONDONTWRITEBYTECODE = "1" }

[tasks.e2e]
run = "cargo run --bin e2e"

[tasks.board]
description = "Show every issue under the rearchitecture's parent issue and the open pull requests"
run = "tools/board"

[tasks."reference:path"]
description = "Print where the reference ccc-server checkout lives"
run = "tools/reference-path"

[tasks."reference:drift"]
description = "Show what changed in the reference since docs/reference/REFERENCE_COMMIT"
run = "tools/reference-drift"
