name: Build and Test

on:
  pull_request:
  push:
    branches: [main, rearchitecture]
  schedule:
    - cron: 0 0 * * *

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  build:
    name: Build and test (${{ matrix.rust }}, ${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
        target:
          - name: host
            triple: host-tuple
          - name: wasm32-unknown-unknown
            triple: wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy
          rustup default "$TOOLCHAIN"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
        with:
          install: false
      - name: Set up Wasm tests
        if: matrix.target.name == 'wasm32-unknown-unknown'
        run: |
          rustup target add wasm32-unknown-unknown
          mise install github:wasm-bindgen/wasm-bindgen
      - name: Fetch dependencies for offline tests
        # The Wasm job also lists host tests to compare test discovery.
        run: cargo fetch --locked --target host-tuple --target ${{ matrix.target.triple }}
      - name: Check shared crates on Wasm
        if: matrix.target.name == 'wasm32-unknown-unknown'
        env:
          MISE_OFFLINE: 'true'
          CARGO_NET_OFFLINE: 'true'
        run: mise run check:wasm
      - name: Check builds without std
        if: matrix.target.name == 'wasm32-unknown-unknown'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: mise run check:features
      - name: Build
        if: matrix.target.name == 'host'
        run: cargo build --workspace --all-features --locked
      - name: Lint
        if: matrix.target.name == 'host'
        run: mise run clippy
      - name: Check documentation
        if: matrix.target.name == 'host'
        run: mise run doc
      - name: Test
        if: matrix.target.name == 'host'
        env:
          MISE_OFFLINE: 'true'
        run: |
          mise run test
          mise run test:doc

  native-image:
    name: Build the native container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag ccc-native:ci .
      - run: python3 tools/test-native-image docker ccc-native:ci

  structure:
    name: Check formatting, dependencies and public API listings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
        with:
          install_args: aqua:EmbarkStudios/cargo-deny cargo:cargo-public-api
      - run: mise run fmt-check
      - run: mise run check:dependencies
      - run: mise run setup:api
      - run: mise run check:api
      - run: mise run test:tools

  fixture-native:
    name: Build and test the native fixture server
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the native entry point
        run: |
          cargo fetch --locked --target host-tuple
          cargo +stable build --locked -p fixture-experiment-native
          cargo +stable test --locked --offline -p fixture-experiment-native -p fixture-experiment-route
      - name: Check the loopback fixture route
        run: |
          python3 -u experiments/fixtures.py > "$RUNNER_TEMP/fixture.log" 2>&1 &
          fixture_pid=$!
          "$CARGO_TARGET_DIR/debug/fixture-experiment-native" > "$RUNNER_TEMP/native.log" 2>&1 &
          native_pid=$!
          cleanup() {
            result=$?
            kill "$native_pid" "$fixture_pid" 2>/dev/null || true
            wait "$native_pid" "$fixture_pid" 2>/dev/null || true
            if [ "$result" -ne 0 ]; then
              cat "$RUNNER_TEMP/fixture.log" "$RUNNER_TEMP/native.log"
            fi
          }
          trap cleanup EXIT

          request() {
            curl --noproxy '*' --fail --silent --show-error --max-time 3 \
              --retry 5 --retry-connrefused --retry-delay 1 "$@"
          }
          test "$(request http://127.0.0.1:18787/value)" = '42'
          check_reply() {
            actual=$(request --write-out $'\n%{http_code} %{content_type}' "http://127.0.0.1:18788/experiment/$1")
            expected="$2"$'\n200 application/json'
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          }
          check_reply value '{"state":"complete","result":{"outcome":"value","value":42}}'
          check_reply redirect '{"state":"complete","result":{"outcome":"failed","failure":{"kind":"http_status","status":302}}}'
          if grep -F 'GET /redirect-target ' "$RUNNER_TEMP/fixture.log"; then
            exit 1
          fi

  fixture-worker:
    name: Build and lint the fixture Worker for WASM
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the WASM target and Clippy
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add clippy
      - name: Build the Worker with the pinned build tool
        working-directory: experiments/worker
        run: |
          npm run worker-build:install
          npm run worker-build -- . --locked
          test -s build/index.js
          test -s build/index_bg.wasm
      - name: Lint the Worker and shared route for WASM
        run: cargo clippy --locked --target wasm32-unknown-unknown -p worker-experiment -p fixture-experiment-route --lib

  ci:
    name: ci
    # List every other job in needs so this status covers the whole workflow.
    needs: [build, native-image, structure, fixture-native, fixture-worker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
