# Route inventory of the reference ccc-server Cloudflare Worker.
#
# Reference: frog-pond/ccc-server at commit 54cf5862e4a09917e9bdc932fa1632fd1c3e0f49
# Generated from the reference implementation's code (workers/src/** and the
# source/** shape functions it imports). Do not hand-edit facts here without
# re-checking them against that commit; `cite` gives file:line proof for each row.
#
# Completion / porting status is deliberately NOT recorded in this file.
#
# What `kind` means:
# - source: answered from a cached upstream source (a SourceDO, read with fetchSource).
# - board: answered from a Durable Object that stores rows in SQLite (student work,
#   student orgs). Designed separately in ccc-server-next #435.
# - redirect: a 307 to a published file. Nothing is fetched.
# - notice: a fixed answer. Nothing is fetched.
# - passthrough: an upstream's own response passed on, after checking the request.
# - ops: not part of the apps' API (the campus list, ping, route listings, the
#   preview listing, the Sentry webhook, the BonApp debug view). Ported only where
#   an issue says so; /previews and /sentry/telegram are deferred (#434).
#
# Conventions:
# - One [[route]] per (campus, path). campus = "" for routes not under a campus.
# - `path` is as the Worker matches it, without the /<campus> prefix.
# - `legacy` lists the canonical Node-era address legacy.ts maps onto the route
#   (toLegacyPath: "/v1" + path, with /news/<n> and /calendar/<n> spelled
#   /v1/news/named/<n> and /v1/calendar/named/<n>). It is served at
#   /<campus>/v1/... on any host and at /v1/... on that campus's Node-era hosts
#   (first host label stolaf | xn--0s9h -> edu.stolaf, carleton | xn--vo8h ->
#   edu.carleton). fromLegacyPath also accepts the plain "/v1" + path spelling.
# - `tests` includes workers/test/route-listing.test.ts for every path that
#   campusPaths() lists (it asserts each is not a 404).
# - Cross-cutting behaviour not repeated per row:
#   * every GET 200 gets a strong ETag (SHA-256 of the body) and If-None-Match
#     answers 304 (workers/src/etag.ts);
#   * any non-GET except POST /sentry/telegram is 405 {error: "method not allowed"};
#   * an unmatched path is 404 {error: "not found"} with no Cache-Control;
#   * with env PAGES_ORIGIN_OVERRIDE set (wrangler dev only) every response
#     from the router gets Cache-Control: no-store (router.ts route());
#   * "source" routes read a SourceDO via fetchSource: fresh 1 h (SOURCE_TTL).
#     For a further day (staleIfError) a stale value is answered at once while
#     it is refreshed behind. Past that, a read waits for the refresh, and if
#     the refresh fails the stored value is still answered with a 200, however
#     old it is (workers/src/source-do.ts:115-129). See
#     docs/reference/cache-semantics.md section 4.

